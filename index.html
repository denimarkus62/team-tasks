<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<title>Задачи команды</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d12c2c'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <h1>Задачи команды</h1>
    <div class="top-r">
      <label class="who">Вы: <select id="me" aria-label="Кто вы"></select></label>
      <span id="sync" class="sync" role="status"></span>
      <button id="keyBtn" class="btn ghost" type="button"></button>
    </div>
  </div>
</header>
<main class="wrap">
  <div id="banner"></div>
  <section id="stats" class="stats" aria-label="Сводка"></section>
  <section id="toolbar" class="toolbar" aria-label="Фильтры"></section>
  <section id="board" aria-live="polite"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<noscript><p class="wrap">Для работы нужен JavaScript.</p></noscript>
<script src="app.js"></script>
</body>
</html>
